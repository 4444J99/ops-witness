name: Jules Orchestrator

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 AM - Backlog Discovery
    - cron: '30 10 * * *'  # 10:30 AM - Batch 1
    - cron: '30 14 * * *'  # 02:30 PM - Batch 2
    - cron: '0 19 * * *'   # 07:00 PM - PR Audit & Merge Digest
  workflow_dispatch:       # Allow manual triggering

jobs:
  jules-orchestrator:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Ops Witness
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai

      - name: Run Gemini Spark Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/jules-orchestrator.mjs

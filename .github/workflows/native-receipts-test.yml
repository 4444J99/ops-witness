name: Native receipt contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/reconcile_jules_receipts.py'
      - 'scripts/test_reconcile_jules_receipts.py'
      - '.github/workflows/native-receipts-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile_jules_receipts.py'
      - 'scripts/test_reconcile_jules_receipts.py'
      - '.github/workflows/native-receipts-test.yml'

permissions:
  contents: read

jobs:
  native-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Record exact checkout
        run: |
          git log -1 --format='%H %P'
          git hash-object scripts/reconcile_jules_receipts.py scripts/test_reconcile_jules_receipts.py
      - name: Run native receipt regression tests
        run: python -B -m unittest discover -s scripts -p 'test_reconcile_jules_receipts.py' -v
      - name: Run existing offline REST witness contracts
        run: node --test scripts/test-jules-api-witness.mjs
      - name: Verify clean checkout
        run: |
          git diff --check
          git diff --exit-code
